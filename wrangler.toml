# Olla — Cajeta package registry Worker.
#
# Local dev: `npm run dev` (wrangler dev) runs the Worker with Miniflare,
# which emulates D1 + R2 entirely on-disk — no Cloudflare account needed.
# Apply migrations first with `npm run migrate:local`.
#
# The Worker is a pure JSON/bytes API (no static-asset binding) so an
# unknown route returns 404 JSON per the protocol spec (§7). The web UI
# (ui/) is a separate Vite app that proxies to this origin in dev and
# deploys to Cloudflare Pages on the same origin in prod.

name = "cajeta-olla"
main = "src/index.ts"
compatibility_date = "2025-07-18"
workers_dev = true
# Pin the account that owns the cajeta.dev zone, so deploys never prompt
# when multiple Cloudflare accounts are configured locally.
account_id = "93232a5aaa10deafb429cb2e6b25bb49"

# Custom domain. wrangler provisions the DNS record + TLS cert on deploy, since
# the cajeta.dev zone is on this Cloudflare account. workers_dev stays on, so the
# *.workers.dev URL keeps working too.
routes = [
  { pattern = "olla.cajeta.dev", custom_domain = true }
]

# Serve the built React UI (ui/dist) from this same Worker, so olla.cajeta.dev/
# is the browsable site while /v2, /.well-known, etc. remain the API. Static
# files are served before the Worker runs; unmatched routes fall to the Worker,
# whose notFound serves index.html for browser navigations (SPA) or JSON 404.
[assets]
directory = "./ui/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

# Catalog (system of record for metadata). The placeholder database_id is
# fine for `--local`; replace with the real id from `wrangler d1 create
# olla-catalog` before any `--remote` apply / deploy.
[[d1_databases]]
binding = "DB"
database_name = "olla-catalog"
database_id = "d00eb192-66bb-415a-bda6-3ad4e7b7fb6a"
migrations_dir = "migrations"

# Artifact bytes (content-addressed at blob/<sha256>).
[[r2_buckets]]
binding = "BLOBS"
bucket_name = "olla-artifacts"

[vars]
# Capability document (§9). TTL the client caches the probe for.
CAPABILITY_TTL_SECONDS = "3600"
# Comma-separated <name>@<version> bundles advertised under
# capabilities.well-known-bundles. NOTE: the stdlib is NOT a bundle — it ships
# embedded in executable .cja/binaries and is never distributed or resolved as a
# separate package. Leave empty until a genuine well-known bundle exists.
WELL_KNOWN_BUNDLES = ""
# Search backend: "d1" (built-in FTS5 trigram) or "algolia" (§12).
SEARCH_PROVIDER = "d1"
# Allow unsigned publishes + an untrusted key-id (skips Ed25519 verification).
# Production-safe default is "0" (signing required). Local dev overrides this to
# "1" via .dev.vars — never enable unsigned on a deployed/public registry.
ALLOW_UNSIGNED = "0"
# Bundle compression level (§14). 19 = strong cross-member dedup, still
# client-decodable (windowLog ≤ 27). Lower it if Worker CPU is tight.
BUNDLE_ZSTD_LEVEL = "19"
# Require a verified namespace proof on publish (§15). Intentionally "0" at
# launch: small teams publish without owning a domain. Namespace verification
# is meant to become a *per-namespace* requirement as a namespace grows
# (graduated trust), not a global flip to "1". Off for local dev too.
REQUIRE_NAMESPACE = "0"

# Repository ROOT public key (publisher-trust §3.1). PUBLIC material, so a var
# and not a secret — and deliberately only the public half. Olla never holds
# the root private key: the operator signs organization documents and the
# delegation offline, and /v2/admin/* accepts the finished envelope. An admin
# credential that could produce a root signature would forge any
# organization's document, which is the collapse the design exists to bound.
CAJETA_ROOT_KEY_ID = "olla-root-1"
CAJETA_ROOT_KEY_PEM = """
-----BEGIN PUBLIC KEY-----
MCowBQYDK2VwAyEASFBathIl7S6b1o47OeDrXMn/dxLxAQgBeGMq6R46wBM=
-----END PUBLIC KEY-----"""

# Transparency-log signing key (§15) is a SECRET — do NOT put it here. Locally
# set LOG_SIGNING_KEY_ID / LOG_SIGNING_KEY_PEM in .dev.vars (gitignored); in
# production use `wrangler secret put LOG_SIGNING_KEY_PEM`.
